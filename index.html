<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>避役所 | Ministry of Camouflage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Spectral:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17191c;
    --paper:#221f1a;
    --brass:#c9a227;
    --teal:#4d8b80;
    --bone:#ede6d6;
    --bone-dim:#b7ae9a;
    --line: rgba(237,230,214,0.16);
    --utility-h: 40px;
    --header-h: 140px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--bone);
    font-family:'Spectral', serif;
    line-height:1.7;
  }
  a{color:inherit;}

  /* ---------- 上部ユーティリティバー（言語切替） ---------- */
  .utility-bar{
    height:var(--utility-h);
    display:flex; align-items:center; justify-content:flex-end;
    padding:0 6vw;
    border-bottom:1px solid var(--line);
  }
  .lang-switch{
    display:flex; border:1px solid var(--line);
  }
  .lang-switch button{
    appearance:none; background:none; border:none;
    color:var(--bone-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:0.06em;
    padding:0.4rem 0.6rem;
    cursor:pointer;
  }
  .lang-switch button + button{border-left:1px solid var(--line);}
  .lang-switch button.active{color:var(--brass); background:var(--paper);}
  .lang-switch button:focus-visible{outline:2px solid var(--teal); outline-offset:-2px;}

  /* ---------- ヘッダー ---------- */
  header{
    position:relative;
    padding:1.6rem 6vw 1.4rem;
    border-bottom:1px solid var(--line);
    min-height:var(--header-h);
    display:flex; flex-direction:column; justify-content:center;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--teal); margin:0 0 0.4rem;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(1.6rem, 3.2vw, 2.2rem);
    margin:0;
  }
  h1 .sub{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:0.06em;
    color:var(--bone-dim); font-weight:400;
    margin-top:0.35rem;
  }
  .tagline{
    font-family:'Spectral', serif;
    font-style:italic;
    color:var(--bone-dim);
    font-size:0.95rem;
    margin:0.6rem 0 0;
    max-width:44ch;
  }

  /* ---------- レイアウト本体：左ナビ + 右パネル ---------- */
  .layout{
    display:grid;
    grid-template-columns: 220px 1fr;
    align-items:start;
  }

  .sidebar{
    position:sticky;
    top:0;
    height:calc(100vh - var(--header-h) - var(--utility-h));
    overflow-y:auto;
    border-right:1px solid var(--line);
    padding:0.8rem 0;
    background-image:
      linear-gradient(180deg, rgba(8,13,28,0.82), rgba(8,13,28,0.88)),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 300 300'><rect width='300' height='300' fill='rgb(9,14,32)'/><g stroke='rgba(90,180,255,0.14)' stroke-width='1'><line x1='0' y1='0' x2='0' y2='300'/><line x1='60' y1='0' x2='60' y2='300'/><line x1='120' y1='0' x2='120' y2='300'/><line x1='180' y1='0' x2='180' y2='300'/><line x1='240' y1='0' x2='240' y2='300'/><line x1='0' y1='0' x2='300' y2='0'/><line x1='0' y1='60' x2='300' y2='60'/><line x1='0' y1='120' x2='300' y2='120'/><line x1='0' y1='180' x2='300' y2='180'/><line x1='0' y1='240' x2='300' y2='240'/></g><rect x='30' y='25' width='42' height='42' fill='none' stroke='rgba(120,220,255,0.4)' stroke-width='1.5' transform='rotate(12 51 46)'/><polygon points='225,70 258,128 192,128' fill='rgba(255,120,190,0.12)' stroke='rgba(255,150,200,0.35)' stroke-width='1.2'/><circle cx='150' cy='230' r='17' fill='none' stroke='rgba(120,220,255,0.3)' stroke-width='1.2'/><line x1='0' y1='300' x2='150' y2='150' stroke='rgba(120,220,255,0.15)' stroke-width='1' stroke-dasharray='4 4'/><line x1='300' y1='0' x2='150' y2='150' stroke='rgba(255,150,200,0.12)' stroke-width='1' stroke-dasharray='4 4'/><text x='12' y='285' font-family='monospace' font-size='10' fill='rgba(150,220,255,0.4)'>0x2F91</text><text x='170' y='22' font-family='monospace' font-size='9' fill='rgba(150,220,255,0.3)'>SYS://</text><text x='95' y='170' font-family='monospace' font-size='9' fill='rgba(255,190,220,0.3)'>LINK_OK</text></svg>");
    background-repeat: no-repeat, repeat;
    background-size: cover, 300px 300px;
    background-position: center, top left;
  }
  .sidebar::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  ul.idx{list-style:none; margin:0; padding:0; position:relative; z-index:1;}
  .idx-item{border-bottom:1px solid var(--line);}
  .idx-link{
    width:100%;
    display:flex; align-items:center; gap:0.6rem;
    background:none; border:none; text-align:left;
    color:var(--bone-dim);
    padding:1rem 1.6rem;
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px; letter-spacing:0.08em; text-transform:uppercase;
  }
  .idx-link:hover{background:var(--paper); color:var(--bone);}
  .idx-link.active{background:var(--paper); color:var(--brass); border-left:2px solid var(--brass); padding-left:calc(1.6rem - 2px);}
  .idx-link:focus-visible{outline:2px solid var(--teal); outline-offset:-2px;}

  /* ---------- 右カラム：詳細パネル ---------- */
  .detail-panel{
    padding:3rem 5vw;
    min-height:calc(100vh - var(--header-h) - var(--utility-h));
    display:flex; flex-direction:column;
  }
  .detail-panel > .head{
    display:flex; align-items:baseline; gap:0.8rem;
    margin-bottom:2rem;
    border-bottom:1px solid var(--line);
    padding-bottom:1.2rem;
  }
  .detail-panel > .head h2{
    font-family:'Fraunces', serif; font-weight:500;
    font-size:1.8rem; margin:0;
  }
  .detail-panel > .head .count{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--bone-dim);
  }
  .text-body{max-width:56ch; color:var(--bone-dim); font-size:1.02rem;}
  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--teal); margin:0 0 0.6rem;
  }
  .text-body .out{margin-top:1.2rem;}
  .text-body .secondary{
    margin-top:1.6rem; padding-top:1.4rem;
    border-top:1px solid var(--line);
  }
  .text-body .secondary p{margin:0 0 0.8rem; font-size:0.92rem;}

  /* ---------- Info欄：匿名プロフィール ---------- */
  .profile{
    display:flex; flex-direction:column; align-items:flex-start;
    gap:0.8rem;
    margin-bottom:2.2rem;
    padding-bottom:2rem;
    border-bottom:1px solid var(--line);
    max-width:56ch;
  }
  .avatar-ring{fill:none; stroke:var(--brass); stroke-width:2;}
  .avatar-shape{fill:var(--paper); stroke:var(--bone-dim); stroke-width:1.5;}
  .profile-name{display:flex; flex-direction:column; gap:0.15rem;}
  .profile .section-label{margin-bottom:0.9rem;}
  .profile-name .jp{
    font-family:'Fraunces', serif; font-weight:500; font-size:1.25rem; color:var(--bone);
  }
  .profile-name .en{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.06em; color:var(--brass);
  }
  .bio{
    color:var(--bone-dim); font-size:0.95rem; font-style:italic; margin:0;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:1.2rem;
  }
  .work-card{
    background:var(--paper);
    border:1px solid var(--line);
    padding:1.3rem 1.2rem 1.1rem;
    display:flex; flex-direction:column; gap:0.6rem;
  }
  .work-card:hover{border-color:var(--brass);}
  .work-card .num{font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--brass);}
  .work-card h3{font-family:'Fraunces', serif; font-weight:500; font-size:1.1rem; margin:0;}
  .work-card p{color:var(--bone-dim); font-size:0.9rem; margin:0; flex:1;}
  .tags{display:flex; flex-wrap:wrap; gap:0.4rem;}
  .tags span{
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--teal);
    border:1px solid var(--teal); padding:0.15rem 0.5rem;
  }
  .out{
    align-self:flex-start;
    display:inline-block;
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:0.04em;
    text-decoration:none; color:var(--bone);
    border-bottom:1px solid var(--brass); padding-bottom:2px;
  }
  .out:hover{color:var(--brass);}
  .out:focus-visible{outline:2px solid var(--teal); outline-offset:3px;}
  .card-links{display:flex; flex-direction:column; gap:0.5rem; margin-top:0.3rem;}

  /* TOPページ下部に表示する著作権表記 */
  .copyright{
    margin-top:auto;
    padding-top:2.4rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--bone-dim);
    opacity:0.7;
  }

  footer{
    border-top:1px solid var(--line);
    padding:2rem 6vw 2.4rem;
    display:flex; flex-wrap:wrap; gap:1.6rem;
    align-items:center; justify-content:space-between;
  }
  footer .links{display:flex; gap:1.2rem; flex-wrap:wrap;}
  footer a.linkitem{
    font-family:'IBM Plex Mono', monospace; font-size:12px;
    text-decoration:none; color:var(--bone-dim); border-bottom:1px solid transparent;
  }
  footer a.linkitem:hover{color:var(--brass); border-color:var(--brass);}
  footer .meta{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--bone-dim); opacity:0.7;}

  @media (prefers-reduced-motion: reduce){ *{transition:none;} }

  /* ---------- モバイル：横スクロールタブバー＋共通パネル ----------
     縦の目録リストを、上部固定・横スクロールのタブバーに切り替え、
     選択内容はデスクトップと同じ detail-panel にそのまま表示します。 */
  @media (max-width:860px){
    :root{--header-h:auto;}
    .utility-bar{padding:0 5vw;}
    header{min-height:auto; padding:1.8rem 5vw 1.4rem;}

    .layout{display:block;}

    .sidebar{
      position:sticky; top:0; z-index:5;
      height:auto; border-right:none; border-bottom:1px solid var(--line);
      background-color:var(--ink);
      background-size: cover, 160px 160px;
      overflow-x:auto; overflow-y:hidden;
      padding:0;
      -webkit-overflow-scrolling:touch;
    }
    ul.idx{display:flex; white-space:nowrap;}
    .idx-item{border-bottom:none; border-right:1px solid var(--line); flex:0 0 auto;}
    .idx-link{padding:0.85rem 1.1rem;}
    .idx-link.active{
      border-left:none;
      border-bottom:2px solid var(--brass);
      padding-left:1.1rem;
    }

    .detail-panel{padding:2rem 6vw 3rem;}
  }
</style>
</head>

<div class="utility-bar">

    <button data-lang="es">ES</button>
    <button data-lang="pt">PT</button>
  </div>
</div>

<header>

  </h1>
  <p class="tagline" data-i18n="tagline"></p>

<div class="layout">

      <li class="idx-item"><button class="idx-link" data-id="link">Link</button></li>

  <!-- 右：詳細パネル（デスクトップ・モバイル共通でここが書き換わる） -->

</div>

<footer>

  let lang = 'ja';

  function applyStaticI18n(){
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key = el.dataset.i18n;
      const text = i18n[lang][key];
      el.textContent = text;
      if(key === 'tagline'){
        el.style.display = text ? '' : 'none';
      }
    });
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-switch button').forEach(b=>{
      b.classList.toggle('active', b.dataset.lang === lang);
    });
  }

  function renderProfile(profile, profileLabel){
    const label = profileLabel ? `<p class="section-label">${profileLabel[lang]}</p>` : '';
    const bioHTML = profile.bio.map(b => `<p class="bio">${b[lang]}</p>`).join('');
    return `
      <div class="profile">
        ${label}
        <div class="avatar">
          <svg viewBox="0 0 120 120" width="84" height="84" aria-hidden="true">
            <circle class="avatar-ring" cx="60" cy="60" r="57"/>
            <path class="avatar-shape" d="M30 40 L43 17 L51 43 Z"/>
            <path class="avatar-shape" d="M90 40 L77 17 L69 43 Z"/>
            <circle class="avatar-shape" cx="60" cy="66" r="29"/>
            <path class="avatar-shape" d="M18 116 C18 88 38 76 60 76 C82 76 102 88 102 116 Z"/>
          </svg>
        </div>
        <div class="profile-name">
          <span class="jp">${profile.nameJa}</span>
          <span class="en">${profile.nameEn}</span>
        </div>
        ${bioHTML}
      </div>
    `;
  }

  function renderTextBody(data){
    const bodyLabel = data.bodyLabel ? `<p class="section-label">${data.bodyLabel[lang]}</p>` : '';
    const body = data.body[lang];
    const body2 = data.body2 ? `<p>${data.body2[lang]}</p>` : '';
    const cta = data.url
      ? `<a class="out" href="${data.url}" target="_blank" rel="noopener">${data.label[lang]} →</a>`
      : '';
    const secondary = data.secondaryUrl
      ? `<div class="secondary"><p>${data.secondaryBody[lang]}</p><a class="out" href="${data.secondaryUrl}" target="_blank" rel="noopener">${data.secondaryLabel[lang]} →</a></div>`
      : '';
    const copyright = data.showCopyright
      ? `<p class="copyright">&copy; 2026 ${i18n[lang].siteTitle}. All rights reserved.</p>`
      : '';
    const profile = data.profile ? renderProfile(data.profile, data.profileLabel) : '';
    return `${profile}<div class="text-body">${bodyLabel}<p>${body}</p>${body2}${cta}${secondary}</div>${copyright}`;
  }

  function renderList(data){
    const cards = data.items.map(it => {
      const linkList = it.links
        ? it.links
        : [{ url: it.url, label: it.label }];
      const linksHTML = linkList
        .map(l => `<a class="out" href="${l.url}" target="_blank" rel="noopener">${l.label[lang]} →</a>`)
        .join('');
      return `
      <article class="work-card">
        <span class="num">${it.num}</span>
        <h3>${it.title[lang]}</h3>
        <p>${it.desc[lang]}</p>
        <div class="tags">${it.tags.map(t=>`<span>${t}</span>`).join('')}</div>
        <div class="card-links">${linksHTML}</div>
      </article>
    `;
    }).join('');
    return `<div class="grid">${cards}</div>`;
  }

  function bodyHTML(data){
    return data.type === "list" ? renderList(data) : renderTextBody(data);
  }

  const panel = document.getElementById('detail-panel');
  const buttons = document.querySelectorAll('.idx-link');
  let activeId = 'top';

  function renderPanel(id, data){
    const count = data.type === "list" ? `<span class="count">${i18n[lang].itemsCount(data.items.length)}</span>` : '';
    panel.innerHTML = `
      <div class="head"><h2>${data.title}</h2>${count}</div>
      ${bodyHTML(data)}
    `;
  }

  function renderCurrent(){
    const data = categories[activeId];
    renderPanel(activeId, data);
    /* 選択中タブが画面外（スマホの横スクロール時）にあれば見える位置までスクロール */
    const btn = document.querySelector(`.idx-link[data-id="${activeId}"]`);
    if(btn) btn.scrollIntoView({block:'nearest', inline:'nearest'});
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeId = btn.dataset.id;
      buttons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderCurrent();
    });
  });

  document.querySelectorAll('.lang-switch button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      lang = btn.dataset.lang;
      applyStaticI18n();
      renderCurrent();
    });
  });

  /* 初期表示 */
  applyStaticI18n();
  document.querySelector('.idx-link[data-id="top"]').classList.add('active');
  renderCurrent();
</script>
